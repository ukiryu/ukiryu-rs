[workspace]
resolver = "2"
members = ["ukiryu", "ukiryu-ffi", "ukiryu-cli"]
exclude = ["tools/dependency-probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "BSD-2-Clause"
repository = "https://github.com/ukiryu/ukiryu-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
num-bigint = "0.4"
# Development pin: explicit `!!str` scalar text in leptris/yeptris-rs#65, on
# top of the qualified float/emitter/MSRV + browser prerequisites in #57 and
# #55. Registry publication remains owner-gated.
yeptris = { git = "https://github.com/leptris/yeptris-rs", rev = "936b4a0b435d538cad1e4777c3f076e5de3c812c", features = ["vendored"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
