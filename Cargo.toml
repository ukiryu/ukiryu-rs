[workspace]
resolver = "2"
members = ["ukiryu", "ukiryu-ffi", "ukiryu-cli"]
exclude = ["tools/dependency-probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "BSD-2-Clause"
repository = "https://github.com/ukiryu/ukiryu-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
num-bigint = "0.4"
# Registry release includes the qualified explicit `!!str`, float/emitter,
# MSRV and browser fixes. Keep the vendored engine pinned to this release.
yeptris = { version = "=0.6.66", features = ["vendored"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
