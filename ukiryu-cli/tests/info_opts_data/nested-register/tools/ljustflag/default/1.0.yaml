---
ukiryu_schema: '1.0'
name: ljustflag
display_name: ljustflag (nested array control)
version: '1.0'
aliases: []
version_detection:
  command: "--version"
  pattern: ljustflag ([d.]+)
search_paths:
  macos:
  - "/nonexistent/ukiryu-corpus/bin/ljustflag"
  linux:
  - "/nonexistent/ukiryu-corpus/bin/ljustflag"
  windows:
  - "C:/nonexistent/ukiryu-corpus/ljustflag.exe"
implements: ljustflag/1.0
execution_profiles:
- name: default
  platforms:
  - linux
  shells:
  - bash
  option_style: double_dash_equals
  executable_name: ljustflag
  commands:
  - name: process
    description: Process input
    flags:
    - name: verbose
      cli: [--verbose, -v]
