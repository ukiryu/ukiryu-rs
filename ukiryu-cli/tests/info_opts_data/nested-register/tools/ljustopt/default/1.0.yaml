---
ukiryu_schema: '1.0'
name: ljustopt
display_name: ljustopt (nested array control)
version: '1.0'
aliases: []
version_detection:
  command: "--version"
  pattern: ljustopt ([d.]+)
search_paths:
  macos:
  - "/nonexistent/ukiryu-corpus/bin/ljustopt"
  linux:
  - "/nonexistent/ukiryu-corpus/bin/ljustopt"
  windows:
  - "C:/nonexistent/ukiryu-corpus/ljustopt.exe"
implements: ljustopt/1.0
execution_profiles:
- name: default
  platforms:
  - linux
  shells:
  - bash
  option_style: double_dash_equals
  executable_name: ljustopt
  commands:
  - name: process
    description: Process input
    options:
    - name: [level, depth]
      cli: "--level"
      type: integer
