[package]
name = "ukiryu-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ukiryu"
path = "src/main.rs"

[dependencies]
ukiryu = { path = "../ukiryu" }
# Keep the CLI parser compatible with the workspace's Rust 1.86 floor.
clap = { version = "=4.5.32", default-features = false, features = ["std", "help", "usage", "error-context"] }

[dev-dependencies]
serde_json.workspace = true
