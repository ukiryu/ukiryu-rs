# WebAssembly probe for the Onigmo regexp engine: exposes ukiryu::types::onig
# and Date._parse to the Node and Chromium checks in this directory. Built
# only by .github/workflows/regexp-onigmo-reference.yml; not a workspace member.
[package]
name = "ukiryu-regexp-onigmo-wasm"
version = "0.0.0"
edition = "2021"
rust-version = "1.86"
license = "BSD-2-Clause"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
ukiryu = { path = "../../ukiryu" }
serde_json = "1"
wasm-bindgen = "=0.2.105"
