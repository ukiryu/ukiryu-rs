name: CLI binary candidates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Candidates only. Attaching assets, tags and release publication need approval.
permissions:
  contents: read

concurrency:
  group: cli-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    name: CLI archive (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build locked native CLI
        shell: bash
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p ukiryu-cli --target "$CLI_TARGET"
      - name: Package and run the extracted CLI
        shell: bash
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python scripts/cli-binary-artifacts.py stage --target "$CLI_TARGET" --directory cli-candidate
          python scripts/cli-binary-artifacts.py verify --directory cli-candidate --run
      - uses: actions/upload-artifact@v4
        with:
          name: ukiryu-cli-${{ matrix.target }}
          path: cli-candidate
          include-hidden-files: true
          if-no-files-found: error

  archives:
    name: Verify downloaded CLI archives
    needs: binary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: ukiryu-cli-*
          path: downloaded-cli
      - name: Verify all targets and reject damaged archives
        run: python scripts/cli-binary-artifacts.py verify --directory downloaded-cli --all-targets --negative-controls
