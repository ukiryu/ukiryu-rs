name: Dependency probe

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Vendored YAML (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ukiryu/ukiryu
          ref: ab6df353c6dc2d7faf7817a86aafcafa82579896
          path: ruby-reference
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Check and execute the published vendored dependency
        shell: bash
        run: |
          cargo test --locked --manifest-path tools/dependency-probe/Cargo.toml
          cargo run --locked --manifest-path tools/dependency-probe/Cargo.toml -- ruby-reference > yaml-values.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: yaml-values-${{ matrix.os }}
          path: yaml-values.jsonl
          if-no-files-found: error

  wasm:
    name: Vendored YAML (wasm32-unknown-unknown)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - name: Check the exact browser-target dependency build
        run: cargo check --locked --manifest-path tools/dependency-probe/Cargo.toml --target wasm32-unknown-unknown
