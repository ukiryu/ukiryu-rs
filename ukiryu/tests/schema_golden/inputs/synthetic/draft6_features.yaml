# Authored for ukiryu-rs schema parity tests: exercises every keyword the
# Rust port implements, under an explicit draft-06 declaration.
$schema: http://json-schema.org/draft-06/schema#
title: Draft 6 feature probe
type: object
required: [name, kind]
properties:
  name: {type: string, minLength: 2, maxLength: 8}
  kind: {enum: [tool, interface, 1, 2.5, null, true, [a], {k: v}]}
  count: {type: integer, minimum: 1, maximum: 10}
  ratio: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1, exclusiveMaximum: true}
  tags: {type: array, minItems: 1, maxItems: 3, items: {type: string}}
  pair: {type: array, items: [{type: string}, {type: integer}]}
  either: {type: [string, integer]}
  homepage: {type: string, format: uri}
  anyhome: {format: uri}
  stamp: {type: string, format: date-time}
  meta:
    type: object
    minProperties: 1
    maxProperties: 2
    additionalProperties: false
    properties:
      a: {type: string}
  env:
    type: object
    additionalProperties: {type: string}
  choice:
    oneOf:
      - {type: string}
      - {type: integer, minimum: 0}
      - {type: number}
  anychoice:
    anyOf:
      - {type: string, minLength: 3}
      - {type: boolean}
  allchoice:
    allOf:
      - {type: object, required: [x]}
      - {type: object, properties: {x: {type: integer}}}
  notnull:
    not: {type: 'null'}
  ref1: {$ref: '#/definitions/thing'}
  refs:
    type: array
    items: {$ref: '#/definitions/thing'}
definitions:
  thing:
    type: object
    required: [id]
    properties:
      id: {type: integer}
      child: {$ref: '#/definitions/thing'}
