[package]
name = "ukiryu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Ukiryu command execution core"
# Initial development scaffold; publication is owner-gated.
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
c = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
num-bigint.workspace = true
yeptris.workspace = true
regex = "1"
# Ruby (Onigmo) Regexp semantics on a pure-Rust engine (look-around,
# possessive and atomic groups; also builds for wasm32). See types/onig.rs.
fancy-regex = { version = "0.20.2", default-features = false, features = ["std", "unicode", "perf"] }
# Match the already qualified Yeptris Rust/browser toolchain.
wasm-bindgen = { version = "=0.2.105", optional = true }
