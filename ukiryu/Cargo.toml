[package]
name = "ukiryu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Ukiryu command execution core"
# Initial development scaffold; publication is owner-gated.
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
c = []
wasm = ["dep:wasm-bindgen"]
# Ruby binding (src/ffi/ruby.rs); entered from a thin magnus extension crate.
ruby = ["dep:magnus"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
num-bigint.workspace = true
yeptris.workspace = true
regex = "1"
# Match the already qualified Yeptris Rust/browser toolchain.
wasm-bindgen = { version = "=0.2.105", optional = true }
# Ruby binding (issue #24): magnus with rb-sys raw-value access, MSRV 1.85.
magnus = { version = "0.9", optional = true, features = ["rb-sys"] }

[build-dependencies]
# Compiles Ruby 4.0.1's Onigmo (vendor/onigmo) for Regexp; see build.rs.
# Same crate and feature set the vendored YAML engine already builds with.
cc = { version = "1", default-features = false }
